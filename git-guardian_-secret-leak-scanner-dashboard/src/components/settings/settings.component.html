
<div class="space-y-8">
  <h2 class="text-3xl font-bold text-white">设置</h2>

  <!-- Whitelist Section -->
  <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-2xl font-bold text-white">白名单</h3>
      <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
        新增白名单
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left text-gray-400">
        <thead class="text-xs text-gray-300 uppercase bg-gray-700">
          <tr>
            <th scope="col" class="px-6 py-3">类型</th>
            <th scope="col" class="px-6 py-3">值</th>
            <th scope="col" class="px-6 py-3">原因</th>
            <th scope="col" class="px-6 py-3"><span class="sr-only">操作</span></th>
          </tr>
        </thead>
        <tbody>
          @for (item of whitelist(); track item.id) {
            <tr class="border-b border-gray-700">
              <td class="px-6 py-4">
                <span class="px-2 py-1 rounded bg-gray-700 text-xs font-semibold">{{ item.type }}</span>
              </td>
              <td class="px-6 py-4 font-mono text-gray-300">{{ item.value }}</td>
              <td class="px-6 py-4">{{ item.reason }}</td>
              <td class="px-6 py-4 text-right">
                <button class="text-red-400 hover:text-red-300">移除</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>

  <!-- Notifications Section -->
  <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
    <h3 class="text-2xl font-bold text-white mb-6">通知</h3>
    <div class="max-w-md space-y-4">
        <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-300">告警邮箱</label>
            <input type="email" id="email" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" placeholder="alerts@example.com">
        </div>
        <div>
            <label for="slack" class="block mb-2 text-sm font-medium text-gray-300">Slack Webhook</label>
            <input type="url" id="slack" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" placeholder="https://hooks.slack.com/services/...">
        </div>
        <button type="submit" class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center">保存通知配置</button>
    </div>
  </div>
</div>
