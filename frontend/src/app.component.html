
<div class="flex h-screen bg-gray-900 text-gray-200 font-sans">
  <!-- Sidebar -->
  <aside class="w-64 flex-shrink-0 bg-gray-800 p-6">
    <div class="flex items-center mb-10">
      <svg class="h-8 w-8 text-indigo-400 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
      <h1 class="text-2xl font-bold text-white">GitGuardian 密钥防护</h1>
    </div>
    <nav class="space-y-2">
      <a (click)="changePage('dashboard')" href="javascript:void(0)" class="flex items-center px-4 py-3 rounded-lg transition-colors duration-200" [class]="currentPage() === 'dashboard' ? 'bg-indigo-500 text-white' : 'text-gray-400 hover:bg-gray-700 hover:text-white'">
        <svg class="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span>仪表盘</span>
      </a>
      <a (click)="changePage('findings')" href="javascript:void(0)" class="flex items-center px-4 py-3 rounded-lg transition-colors duration-200" [class]="currentPage() === 'findings' ? 'bg-indigo-500 text-white' : 'text-gray-400 hover:bg-gray-700 hover:text-white'">
        <svg class="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>发现列表</span>
      </a>
       <a (click)="changePage('scan')" href="javascript:void(0)" class="flex items-center px-4 py-3 rounded-lg transition-colors duration-200" [class]="currentPage() === 'scan' ? 'bg-indigo-500 text-white' : 'text-gray-400 hover:bg-gray-700 hover:text-white'">
        <svg class="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <span>手动扫描</span>
      </a>
      <a (click)="changePage('rules')" href="javascript:void(0)" class="flex items-center px-4 py-3 rounded-lg transition-colors duration-200" [class]="currentPage() === 'rules' ? 'bg-indigo-500 text-white' : 'text-gray-400 hover:bg-gray-700 hover:text-white'">
        <svg class="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
        <span>规则管理</span>
      </a>
      <a (click)="changePage('settings')" href="javascript:void(0)" class="flex items-center px-4 py-3 rounded-lg transition-colors duration-200" [class]="currentPage() === 'settings' ? 'bg-indigo-500 text-white' : 'text-gray-400 hover:bg-gray-700 hover:text-white'">
        <svg class="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>设置</span>
      </a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-8 overflow-y-auto">
    @switch (currentPage()) {
      @case ('dashboard') {
        <app-dashboard />
      }
      @case ('findings') {
        <app-findings />
      }
      @case ('scan') {
        <app-scan />
      }
      @case ('rules') {
        <app-rules />
      }
      @case ('settings') {
        <app-settings />
      }
    }
  </main>
</div>
